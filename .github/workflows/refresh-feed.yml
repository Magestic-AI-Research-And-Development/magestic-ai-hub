name: Refresh live feed

on:
  # Every 10 minutes — the practical maximum on GitHub Actions. Scheduled runs
  # are queued "no earlier than" the cron time, so real-world cadence is
  # ~10-20 min under load. This is the ONLY schedule for the feed: the old
  # Supabase every-15-min dispatcher was retired so there is a single source
  # of truth for cadence. (Fine on a public repo: Actions minutes are free.
  # If this repo ever goes private, slow this cron down or minutes will burn.)
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}    # manual "Run workflow" button

concurrency: {group: feed-refresh, cancel-in-progress: false}
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh repeatedly inside one run
        # GitHub's scheduler is the weak link: a "*/10 * * * *" cron on this repo
        # has in practice fired every 2-6 hours, and once went 23 hours silent.
        # We can't fix GitHub's queue, but we don't have to depend on it for every
        # refresh: one run now loops internally, refreshing every ~9 minutes for
        # ~45 minutes. Even a single scheduled run per hour yields ~5 refreshes,
        # and consecutive runs overlap into near-continuous coverage.
        # (Job limit is 6h; this stays far inside it. Free on a public repo.)
        run: |
          git config user.name "hub-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "::group::refresh pass $i of 5"
            node scripts/update-feed.mjs || echo "pass $i failed, continuing"
            if ! git diff --quiet data/feed-live.js; then
              git add data/feed-live.js
              git commit -m "chore: feed refresh"
              # Re-pull in case another run committed while we slept.
              git push || (git pull --rebase -X theirs origin main && git push)
              echo "pass $i: committed"
            else
              echo "pass $i: no changes"
            fi
            echo "::endgroup::"
            if [ "$i" -lt 5 ]; then sleep 540; fi
          done
