name: Refresh live feed

on:
  # Every 2.5 hours. Cron has no 2.5-hour step (24 is not divisible by 2.5), so the
  # ten daily slots are listed explicitly across two entries:
  #   00:00  02:30  05:00  07:30  10:00  12:30  15:00  17:30  20:00  22:30  UTC
  # Every gap is exactly 2.5h except the 22:30 -> 00:00 wrap, which is 1.5h.
  # This is the ONLY schedule for the feed: the old Supabase every-15-min dispatch
  # was retired so there is a single source of truth for cadence.
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
    - cron: "30 2,7,12,17,22 * * *"
  workflow_dispatch: {}    # manual "Run workflow" button

concurrency: {group: feed-refresh, cancel-in-progress: false}
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate data/feed-live.js
        run: node scripts/update-feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "hub-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet data/feed-live.js; then
            git add data/feed-live.js
            git commit -m "chore: feed refresh"
            git push || (git pull --rebase -X theirs origin main && git push)
          else
            echo "No feed changes."
          fi
