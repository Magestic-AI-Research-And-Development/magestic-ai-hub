name: Deploy to Cloudflare

# Deploys the static site to a Cloudflare Worker (magestic-ai-hub) on every push.
# Requires two repo Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Until they exist, this workflow no-ops with a warning instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: {group: cloudflare-deploy, cancel-in-progress: true}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not configured yet (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID). Skipping deploy."
            exit 0
          fi
          npx wrangler@4 deploy
